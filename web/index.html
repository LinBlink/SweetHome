  <!-- The engine and the app bundle are both multi-MB and both are
       needed before anything paints. Fetching them at high priority
       from the first HTML byte, rather than waiting for
       flutter_bootstrap.js to ask, overlaps the two biggest downloads
       with each other instead of running them back to back. -->
  <link rel="preload" href="main.dart.js" as="script">
  <script>
    // The CanvasKit preload has to name a specific file, but which one
    // the engine actually loads depends on the browser: Flutter's
    // default `canvasKitVariant: auto` gives Chromium the trimmed
    // `chromium/canvaskit.wasm` and everyone else the full
    // `canvaskit.wasm`. Hard-coding the Chromium one meant Safari
    // downloaded 5.5MB it would never use, *and* still had to fetch
    // the 6.9MB it needed — bandwidth and peak memory that iOS in
    // particular cannot spare, delaying first paint. So pick here.
    //
    // Chrome on iOS reports CriOS and is WebKit underneath, so it must
    // NOT match; the explicit Chrome/Chromium/Edg test leaves it out.
    // Opera reports both OPR and Chrome and uses the Chromium engine,
    // so matching it on Chrome is correct.
    (function () {
      var ua = navigator.userAgent;
      var chromium = /Chrome|Chromium|Edg/.test(ua) && !/CriOS/.test(ua);
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'fetch';
      link.type = 'application/wasm';
      link.crossOrigin = 'anonymous';
      link.href = chromium
        ? 'canvaskit/chromium/canvaskit.wasm'
        : 'canvaskit/canvaskit.wasm';
      document.head.appendChild(link);
    })();
  </script>

  <style>
    /* Inlined rather than a stylesheet: this is the only CSS that runs
       before the app exists, and a separate file would be one more
       blocking request in front of the paint it's meant to cover. */
    html, body { margin: 0; padding: 0; height: 100%; background: #FFF8F0; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1A1512; }
    }

    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #FFF8F0;
      opacity: 1;
      transition: opacity 320ms ease-out;
      /* Above the canvas Flutter inserts, until we take it away. */
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      #boot-splash { background: #1A1512; }
    }
    #boot-splash.boot-splash--done {
      opacity: 0;
      pointer-events: none;
    }

    .boot-splash__mark {
      width: 96px;
      height: 96px;
      box-sizing: border-box;
      border-radius: 26px;
      box-shadow: 0 8px 18px rgba(215, 101, 73, 0.4);
      border: 3px solid #FFF8F0;
      /* The artwork is a full-bleed square with its own terracotta
         ground, so it supplies the fill that used to be a CSS gradient.
         Clip it to the rounded corners. */
      overflow: hidden;
      animation: boot-pulse 1.6s ease-in-out infinite;
    }
    @media (prefers-color-scheme: dark) {
      .boot-splash__mark { border-color: #242019; }
    }
    .boot-splash__mark img {
      display: block;
      width: 100%;
      height: 100%;
    }

    @keyframes boot-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }
    /* Anyone who asked the OS for less motion gets a static mark. */
    @media (prefers-reduced-motion: reduce) {
      .boot-splash__mark { animation: none; }
    }

    .boot-splash__name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #3D2B1F;
    }
    @media (prefers-color-scheme: dark) {
      .boot-splash__name { color: #EDE4D9; }
    }

    .boot-splash__pct {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      color: #D76549;
      /* Tabular figures: without them the digits have different widths
         and the whole number jitters sideways on every tick, which at
         this size is very visible. */
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }
    .boot-splash__pct span {
      font-size: 15px;
      font-weight: 600;
      margin-left: 2px;
    }

    /* Progress track. Fixed width rather than a percentage so the bar
       is the same size on a phone and a 4K monitor — a 60%-of-viewport
       bar on desktop reads as a page element, not as a loading hint. */
    .boot-splash__track {
      width: 180px;
      max-width: 60vw;
      height: 4px;
      border-radius: 999px;
      background: rgba(61, 43, 31, 0.12);
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      .boot-splash__track { background: rgba(237, 228, 217, 0.15); }
    }

    .boot-splash__fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #D76549, #E8944F);
      /* The JS eases the value itself; this only smooths the steps
         between ticks, so it stays short. */
      transition: width 140ms linear;
    }

    .boot-splash__hint {
      font-size: 12px;
      letter-spacing: 0.4px;
      color: #8B7355;
      /* Reserve the line's height from the first paint. Without this
         the mark and name jump upward the moment the text appears. */
      min-height: 17px;
      text-align: center;
      padding: 0 24px;
      max-width: 320px;
    }
    @media (prefers-color-scheme: dark) {
      .boot-splash__hint { color: #B8A890; }
    }

    /* Error state: only shown if the app demonstrably never came up.
       Replaces the bar rather than sitting next to it, so there is
       never a progress bar creeping under a failure message. */
    .boot-splash--failed .boot-splash__track { display: none; }
    .boot-splash--failed .boot-splash__mark { animation: none; }
    .boot-splash__retry {
      display: none;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: #D76549;
      border: 0;
      border-radius: 999px;
      padding: 9px 22px;
      cursor: pointer;
    }
    .boot-splash--failed .boot-splash__retry { display: block; }
  </style>

    // signal, and not a requestAnimationFrame guess, is what ends it.

      var done = false;
      var failed = false;
      var splash = document.getElementById('boot-splash');
      var track = document.getElementById('boot-track');
      var fill = document.getElementById('boot-fill');
      var pct = document.getElementById('boot-pct');

      // that exists, so it picks from navigator.language itself. These
      // draw with system fonts (see the font-family on #boot-splash),
      // not CanvasKit, so they are not subject to the bundled-subset
      // rules that govern text inside the app.
      // `phases` cycles while loading; the copy is deliberately in the
      // app's own voice (a house, a wallet, a family tree) rather than
      // "Loading…", so the wait reads as the app getting a home ready.

        zh: {
          phases: ['正在装修房子…', '正在整理钱包金额…', '正在渲染族谱…'],
          error: '加载失败，请检查网络后重试', reload: '重新加载'
        },
        zhHant: {
          phases: ['正在裝修房子…', '正在整理錢包金額…', '正在繪製族譜…'],
          error: '載入失敗，請檢查網路後重試', reload: '重新載入'
        },
        en: {
          phases: ['Decorating the house…', 'Counting up the wallet…', 'Drawing the family tree…'],
          error: "Couldn't load. Check your connection and try again.", reload: 'Reload'
        },
        ja: {
          phases: ['お家を飾りつけ中…', 'お財布を整理中…', '家系図を描画中…'],
          error: '読み込みに失敗しました。接続を確認して再試行してください。', reload: '再読み込み'
        },
        ko: {
          phases: ['집을 꾸미는 중…', '지갑을 정리하는 중…', '가계도를 그리는 중…'],
          error: '불러오지 못했습니다. 연결을 확인한 후 다시 시도해 주세요.', reload: '새로고침'
        },
        my: {
          phases: ['အိမ်ကို ပြင်ဆင်နေသည်…', 'ပိုက်ဆံအိတ်ကို စီစဉ်နေသည်…', 'မိသားစုဇယားကို ဆွဲနေသည်…'],
          error: 'မဖွင့်နိုင်ပါ။ ချိတ်ဆက်မှုကို စစ်ဆေးပြီး ထပ်စမ်းကြည့်ပါ။', reload: 'ပြန်လည်ဖွင့်ရန်'
        }
      };
      function pickStrings() {
        var tag = (navigator.language || 'zh').toLowerCase();
        if (tag.indexOf('zh') === 0) {
          // Hant for the explicit script tag and for the regions that
          // use it; everything else zh falls to Hans.
          return /hant|\-(tw|hk|mo)\b/.test(tag) ? STRINGS.zhHant : STRINGS.zh;
        }
        if (tag.indexOf('ja') === 0) return STRINGS.ja;
        if (tag.indexOf('ko') === 0) return STRINGS.ko;
        if (tag.indexOf('my') === 0) return STRINGS.my;
        if (tag.indexOf('en') === 0) return STRINGS.en;
        return STRINGS.zh;   // matches the app's own default locale
      }
      var T = pickStrings();

      // ── Progress ──────────────────────────────────────────────────
      // Milestones are real events, never timers. Between them the
      // displayed value eases toward the *next* milestone, so the
      // number always moves but can never reach a stage the app hasn't
      // actually got to. Nothing here invents completion: 100% happens
      // on the first painted frame and nowhere else.
      //
      // The ramp is deliberately front-loaded — the early ceilings are
      // high and the approach is fast, so the number sprints into the
      // 40s the moment the page paints and keeps climbing briskly.
      // Perceived speed is what decides whether someone waits, and a
      // counter that crawls from 0 reads as a stuck app even when the
      // bytes are moving fine. The deceleration near each ceiling is
      // what keeps it from parking at 99% and looking hung instead.
      var STAGES = [0.06, 0.42, 0.72, 0.88, 0.96, 1];
      var APPROACH = 0.12;   // per 50ms tick — ~0.4s to close a gap
      var stage = 0;         // index into STAGES that we have reached
      var shown = 0;         // what the bar/number are currently drawing
      var startedAt = Date.now();

      function render() {
        var pctValue = Math.min(100, Math.floor(shown * 100));
        fill.style.width = (shown * 100).toFixed(1) + '%';
        pct.firstChild.nodeValue = pctValue;
        track.setAttribute('aria-valuenow', pctValue);
      }

      // 50ms tick rather than rAF: this runs while the main thread is
      // busy parsing a multi-MB bundle, where rAF callbacks are exactly
      // what gets starved. A timer at least keeps the number updating
      // between long tasks, and the CSS transition smooths the rest.
      var ticker = window.setInterval(function () {
        if (done) return;
        var ceiling = STAGES[Math.min(stage + 1, STAGES.length - 1)];
        // Approach but never touch the next milestone.
        shown += (ceiling - 0.01 - shown) * APPROACH;
        if (shown < 0) shown = 0;
        render();
      }, 50);

      // Rotate the phase copy on its own clock rather than tying it to
      // progress bands: on a warm cache the bar is done in under a
      // second, and band-mapped copy would flash past unreadably. A
      // fixed cadence means whatever the user does see, they can read.
      var phaseIndex = 0;
      hint.textContent = T.phases[0];
      var phaser = window.setInterval(function () {
        if (done || failed) return;
        phaseIndex = (phaseIndex + 1) % T.phases.length;
        hint.textContent = T.phases[phaseIndex];
      }, 1600);

      // Called by flutter_bootstrap.js as each real boot step lands.
      // Monotonic by construction — a later call can't lower `stage`.
      window.__bootProgress = function (index) {
        if (done || index <= stage) return;
        stage = Math.min(index, STAGES.length - 1);
        if (shown < STAGES[stage]) shown = STAGES[stage];
        render();
      };

      // Paint the starting state immediately. Not via __bootProgress:
      // stage is already 0, and that call is monotonic, so it would be
      // a no-op.
      retry.textContent = T.reload;
      shown = STAGES[0];
      render();

      // Downloading the bundle is the long pole, and between "script
      // started" and "entrypoint ready" there are no callbacks at all.
      // main.dart.js landing is a real event in that window, so report
      // it — otherwise the number sits against the stage-1 ceiling for
      // the whole download.
      if (window.PerformanceObserver) {
        try {
          new PerformanceObserver(function (list) {
            var entries = list.getEntries();
            for (var i = 0; i < entries.length; i++) {
              var e = entries[i];
              if (!/main\.dart\.js/.test(e.name)) continue;
              // A 404 produces a resource timing too, so "the request
              // finished" is not the same as "the bundle arrived" —
              // without this check a broken deploy still marches the
              // number up as if it were loading. responseStatus is
              // recent-ish; where it is missing, 0 means the browser
              // won't say, and we fall back to trusting the entry.
              var status = e.responseStatus;
              if (status && (status < 200 || status >= 300)) continue;
              window.__bootProgress(2);
            }
          }).observe({ type: 'resource', buffered: true });
        } catch (e) { /* older browsers: we just lose the extra signal */ }
      }

      // ── Teardown ──────────────────────────────────────────────────
      window.dismissBootSplash = function () {
        // Idempotent: Dart may call on more than one frame, and the
        // watchdog below can race a normal dismissal.
        if (done) return;
        done = true;
        window.clearInterval(ticker);
        window.clearInterval(phaser);
        if (!splash) return;
        shown = 1;
        render();
        // Let the filled bar be visible for a beat before fading —
        // snapping to 100% and vanishing in the same frame reads as a
        // glitch rather than as completion.
        window.setTimeout(function () {
          splash.classList.add('boot-splash--done');
          window.setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }, 120);
      };

      // ── Watchdog ──────────────────────────────────────────────────
      // One deadline, measured from page start, and it is deliberately
      // long: 60s. Anything shorter shows a failure to people whose app
      // is booting perfectly well.
      //
      // This previously fired on a 10s *stall* — 10s with no milestone
      // and no completed request. That looked defensible and wasn't:
      // between "entrypoint loaded" and the first frame, Dart is
      // compiling and running on the main thread, issuing no requests
      // and reporting no milestones. That silence is normal, and on a
      // cold load it routinely runs past 10s. So the splash showed
      // "couldn't load" with a Reload button, and then the app finished
      // booting and dismissed the splash out from under it — a failure
      // message followed by a working app, which is worse than either.
      //
      // A stall is simply not evidence of failure here. Elapsed time is
      // the only signal we have that means anything, so use it, and set
      // it far enough out that reaching it really is broken.
      var DEADLINE_MS = 60000;

      window.setInterval(function () {
        if (done || failed) return;
        if (Date.now() - startedAt < DEADLINE_MS) return;

        // Flutter put a view in the DOM, so the app is up and only our
        // dismissal signal went missing — uncovering it is right.
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          console.warn(
            '[boot] Flutter rendered but never called dismissBootSplash ' +
            'within ' + (DEADLINE_MS / 1000) + 's. Uncovering the app.'
          );
          window.dismissBootSplash();
          return;
        }

        // No view after a full minute: keep the splash and offer a
        // retry. Tearing it off would leave a bare <body> — a blank
        // page, with nothing to read and nothing to do.
        failed = true;
        window.clearInterval(phaser);
        splash.classList.add('boot-splash--failed');
        hint.textContent = T.error;
        console.error(
          '[boot] No Flutter view ' + (DEADLINE_MS / 1000) + 's after page ' +
          'start. The app never booted: check that the requests under this ' +
          'document\'s <base href> are 200s.'
        );
      }, 1000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
